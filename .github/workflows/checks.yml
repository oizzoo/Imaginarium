name: Site checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sprawdz linki, assety i strukture strony
        run: python scripts/check-site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check banner loading
        run: node --test scripts/banner.test.cjs
